<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>My First JavaScript Program</h2>

    <button onclick="runCode()">Run code</button>
    <p id="result"></p>

    <script>
        function runCode(){
            //step 1: store a number in a variable
            let number1=10;
            let number2=5;

            let sum=number1 + number2;

            document.getElementById("result").innerText="sum is: "+ sum;

        }
    </script>

    <h2>Data types Example</h2>

    <button onclick="runcode2()">Run Code</button>

    <p id="result2"></p>
    
    <script>
        function runcode2(){
            let age=20;

            let name="Krishna";

            let isStudent=true;

            document.getElementById("result2").innerText=
            "age type: "+typeof age+" | "+"name type "+typeof name+" | "+"isStudent type: "+ typeof isStudent;
        }
    </script>

        <h2>Operators Example</h2>

    <button onclick="runcode3()">Run Code</button>

    <p id="result3"></p>

    <script>
        function runcode3(){
            let a=12;
            let b=37;

            document.getElementById("result3").innerText=
            "a + b = "+(a+b)+" | "+
            "a - b = "+(a-b)+" | "+
            "a * b = "+(a*b)+" | "+
            "a / b = "+(a/b)+" | "+
            "a % b = "+(a%b)+" | "+
            "a > b: "+(a>b)+" | "+
            "a === b: "+(a===b);
        }
    </script>
    


    <h2>If-Else Example</h2>


    <button onclick="runcode4()">Run Code</button>
    
    <p id="result4"></p>

    <script>
        function runcode4(){
            let marks=75;

            if(marks>=90){
                 document.getElementById("result4").innerText="Grade A";

            }
            else if(marks>=60){
                 document.getElementById("result4").innerText="Grade B";
            }

            else{
                 document.getElementById("result4").innerText="Grade C= Needs Improvement";
            }
        }
    </script>

    <h2>Function call by parameter</h2>

    
    <button onclick="runcode5()">Run Code</button>
    
    <p id="result5"></p>

    <script>
        function runcode5(){
            function addnumber(x,y){
                return x+y;
            }

            let sum = addnumber(5,7);
        
      
        document.getElementById("result5").innerText="sum: "+sum;

        }



            </script>
       

            <h2>Array Example</h2>

             <button onclick="runcode6()">Run Code</button>
             <p id="result6"></p>

             <script>
                function runcode6(){
                    let student=["priyanka","naina","krishna"];

                    let first=student[0];

                    let total=student.length;

                    student.push("krishna");

                    document.getElementById("result6").innerText="first: "+first+" | "+"total: "+ total+" | "+"after add: "+ student;

                    
                }
             </script>

             <h2>Key-pair example</h2>

             
             <button onclick="runcode7()">Run Code</button>
             <p id="result7"></p>

             <script>
                function runcode7(){

                    let student={
                        name:"krishna",
                        age: 20,
                        marks: 90
                    };

                    let studentname=student.name;

                    let studentAge=student["age"];

                    student.marks=90;

                    document.getElementById("result7").innerText="name: "+studentname+" | "+ "age: "+studentAge+" | "+"Updated marks: "+student.marks;


                }
             </script>
             

             <h2>DOM manuplitation</h2>
             
             <button onclick="runcode8()">Run Code</button>
             <p id="demotext"></p>

             <script>
                function runcode8(){
                    document.getElementById("demotext").innerText="Hello! javascript changed this text";

                    document.getElementById("demotext").style.color="green";
                }
             </script>

             <h2>Events Example</h2>

               
             <button onclick="setupEvent()">setup event</button>
             <button id="clickMeBtn">Click me</button>

             <script>
                function setupEvent(){
                    document.getElementById("clickMeBtn").addEventListener("click",function()
                    {
                        alert("you clicked the button! ");
                    });

                }
             </script>
        
                <h2>Template Literals Example</h2> 

                <button onclick="runCode8()">Run Code</button> 

                <p id="result8"></p>   
                 <script>     
                    function runCode8() {        
                        let name = "Riya";       
                        let marks = 88; 
                          let message = `Name: ${name}, Marks: ${marks}`; 

                          document.getElementById("result8").innerText = message; 

                           }   
                        </script> 
                        





</body>
</html>
