<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="tasklist">
        <li>Sample Task 1</li>
        <li>Sample Task 2</li>
    </ul>

    <script>
        document.getElementById("tasklist").addEventListener("click",(event)=>{
            if(event.target.tagName==="LI"){
                event.target.remove();
            }
        });
    </script>
</body>
</html>
